name: CI
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install libcurl headers
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y libcurl4-openssl-dev libsecret-1-dev
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build --output-on-failure -C Release
        env:
          KRYPTOS_TEST_SYSTEM_CREDENTIALS: ${{ runner.os == 'Windows' && '1' || '' }}
      - name: Report test failure
        if: failure()
        run: python tests/report_failure.py
      - uses: actions/upload-artifact@v4
        with:
          name: KryptosCore-${{ matrix.os }}
          path: |
            build/kryptos
            build/Release/kryptos.exe
          if-no-files-found: error
